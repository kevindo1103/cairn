[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "iceflow-harness"
version = "0.1.3"
description = "Read-only engineering checks and evidence harness with a Bingxue profile"
requires-python = ">=3.11"
dependencies = ["PyYAML==6.0.3", "jsonschema==4.26.0", "defusedxml==0.7.1"]
readme = "README.md"
license = {text = "Proprietary; delivered for the user's project use"}

[project.optional-dependencies]
test = ["pytest==9.0.2", "SQLAlchemy==2.0.50"]

[project.scripts]
iceflow-harness = "iceflow_harness.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
iceflow_harness = ["data/*.json", "data/*.yml", "data/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
