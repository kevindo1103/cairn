name: Cairn host pilot

on:
  pull_request:
    paths:
      - 'packages/cairn-host/**'
      - 'packages/cairn-adapter/**'
      - 'packages/communication-ledger/**'
      - '.github/workflows/cairn-host.yml'
  push:
    branches: [main]
    paths:
      - 'packages/cairn-host/**'
      - 'packages/cairn-adapter/**'
      - 'packages/communication-ledger/**'
      - '.github/workflows/cairn-host.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host:
    name: Windows host tests and process rehearsals
    runs-on: windows-latest
    timeout-minutes: 8
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Import and verify pinned core package
        run: |
          @'
          import sys
          sys.path.insert(0, 'packages/cairn-host')
          import local_queue_pilot as pilot
          assert pilot.dependencies()['verify_package']()['source_commit'] == pilot.CORE
          print('Host import and pinned core verification PASS')
          '@ | python -I -
          exit $LASTEXITCODE
      - name: Run host unittest discovery (zero skips)
        run: |
          @'
          import unittest
          suite = unittest.defaultTestLoader.discover('packages/cairn-host/tests')
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          raise SystemExit(0 if result.wasSuccessful() and result.testsRun >= 15 and not result.skipped else 1)
          '@ | python -I -
          exit $LASTEXITCODE
      - name: Compile host code and tests
        run: python -m compileall -q packages/cairn-host
      - name: Run all six process scenarios and HANDOFF
        run: |
          $pilotRoot = Join-Path $env:RUNNER_TEMP 'cairn-host'
          New-Item -ItemType Directory -Path $pilotRoot -ErrorAction Stop | Out-Null
          foreach ($scenario in @('happy','receipt_only','crash_after_ack','duplicate','wrong_mapping','impersonate','handoff')) {
            $runRoot = Join-Path $pilotRoot $scenario
            python packages/cairn-host/local_queue_pilot.py --run-root $runRoot --scenario $scenario
            if ($LASTEXITCODE -ne 0) { throw "Scenario failed: $scenario" }
          }
      - name: Retain synthetic result proofs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cairn-host-proofs-${{ github.sha }}
          path: |
            ${{ runner.temp }}/cairn-host/**/evidence/result.json
            ${{ runner.temp }}/cairn-host/**/evidence/handoff-retained.json
          if-no-files-found: error
          retention-days: 7
