name: PR Quality Gate

on:
  pull_request:
    branches: [main, staging]
  push:
    branches: [main]

jobs:
  core:
    name: Cairn package — core tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/communication-ledger
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -v

  mcp:
    name: Cairn package — MCP tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/communication-ledger
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[mcp]'
      - run: python -m unittest discover -v

  adapter:
    name: Cairn adapter — contract tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/cairn-adapter
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - if: ${{ hashFiles('packages/cairn-adapter/run_tests.py') != '' }}
        run: python run_tests.py
      - if: ${{ hashFiles('packages/cairn-adapter/run_tests.py') != '' }}
        run: python -m compileall -q cairn_adapter tests
      - if: ${{ hashFiles('packages/cairn-adapter/run_tests.py') != '' }}
        run: python -m pip wheel . --no-deps --wheel-dir dist
