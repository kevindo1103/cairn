name: PR Quality Gate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  core:
    name: Cairn package — core tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/communication-ledger
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -v

  mcp:
    name: Cairn package — MCP tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/communication-ledger
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[mcp]'
      - run: python -m unittest discover -v

  adapter:
    name: Cairn adapter — contract tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/cairn-adapter
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Detect adapter delta
        id: adapter_delta
        working-directory: ${{ github.workspace }}
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" != "pull_request" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif git diff --quiet "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" -- packages/cairn-adapter; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - if: ${{ steps.adapter_delta.outputs.changed == 'true' }}
        run: python run_tests.py
      - if: ${{ steps.adapter_delta.outputs.changed == 'true' }}
        run: python -m compileall -q cairn_adapter tests
      - if: ${{ steps.adapter_delta.outputs.changed == 'true' }}
        run: python -m pip wheel . --no-deps --wheel-dir dist
