name: PR Quality Gate

on:
  pull_request:
    branches: [main, staging]
  push:
    branches: [main]

jobs:
  core:
    name: Cairn package — core tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/communication-ledger
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -v

  mcp:
    name: Cairn package — MCP tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/communication-ledger
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[mcp]'
      - run: python -m unittest discover -v
